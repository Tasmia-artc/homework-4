<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flag-list</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body> 
    <div class="main-box">
        <div class="box">
           <div class="box-1"></div>
        </div>
    <div class="parent">
        <div class="parent-box"></div>
    </div>
    <div class="flag-box">
        <img src="./images/flag.png" alt="flag logo">
    </div>
    <div class="barbados-flag">
        <div class="barbados-flag-box">
            <img src="./images/barbados.png" alt="flag logo">
        </div>
    </div>
    <div class="afganistan">
        <img src="./images/afganistan.png" alt="flag logo">
    </div>
<div class="section">
      <div class="section-part">
        <img src="./images/iraq.png" alt="flag logo">
      </div>
      <div class="section-part-one"></div>
</div>
</div>
   <div class="flex-div">
<div class="maldives">
    <div class="maldives-part">
        <img src="./images/pic.png" alt="flag logo">
    </div>
</div>
<div class="benin">
    <div class="benin-part-one"></div>
    <div class="benin-part-two"></div>
</div>
<div class="finland-flag">
  <div class="finland-flag-part"></div>
  <div class="finland-part"></div>
</div>
<div class="saudi-flag">
    <img src="./images/saudi.png" alt="flag logo">
</div>
<div class="sudan-part">
    <div class="sudan-part-one"></div>
    <div class="sudan-part-two"></div>
    <div class="sudan-part-three"></div>
</div>
<div class="belgium">
    <div class="belgium-box"></div>
    <div class="belgium-box-one"></div>
</div>
</div>
<div class="flex-box">
<div class="bootswana"> 
    <div class="child-part">
        <div class="child-part-two"></div>
    </div> 
</div>
<div class="flag-section">
    <img src="./images/star.png" alt="flag logo">
</div>

<div class="tunisia-flag">
    <div class="tunisia-circle">
        <img src="./images/tunisia.png" alt="flag logo">
    </div>
</div>
<div class="ukraine">
    <div class="ukraine-part"></div>
</div>
<div class="latvia-flag">
    <div class="latvia-child-part"></div>
</div>
<div class="armenia">
    <div class="blue-part"></div>
    <div class="last-part"></div>
</div>
</div>  
<div class="last-part">
 <div class="cote-part">
    <div class="cote-part-white"></div>
    <div class="cote-part-green"></div>
 </div>
<div class="egypt-flag">
    <div class="egypt-part">
         <img src="./images/egypt.png" alt=" flag-logo">
    </div>
    <div class="part-one">
       
    </div>
</div>
</div>
</body>
</html>
